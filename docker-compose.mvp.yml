volumes:
  integration_pgdata:

networks:
  integration_default:
    driver: bridge
  glpi_default:
    external: true

services:
  postgres:
    image: postgres:15-alpine
    container_name: integration-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - integration_pgdata:/var/lib/postgresql/data
    networks:
      - integration_default
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integration-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - integration_default
      - glpi_default
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
