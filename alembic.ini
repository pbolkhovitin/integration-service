[alembic]
# Path to migration scripts.
# Use forward slashes (/) also on windows to provide an OS agnostic path
script_location = alembic

# The python calling context Alembic uses to access the project's code.
# Default: "alembic" — the package containing env.py and script.py.mako.
prepend_sys_path = .

# The output encoding for the migration files.
# Default: UTF-8
output_encoding = utf-8

# Database URL — will be overridden in alembic/env.py via DATABASE_URL env var.
sqlalchemy.url = postgresql+asyncpg://integration:changeme@localhost:5432/integration

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
